      <rect x="22" y="76" width="228" height="230" rx="16" fill="#F8FBFF" stroke="#DBEEFF"/><use href="#mark" x="96" y="94" width="80" height="80"/><text x="136" y="194" text-anchor="middle" class="label">Nabta POS</text><rect x="48" y="214" width="176" height="36" rx="9" fill="#FFF" stroke="#B8D8F5"/><rect x="48" y="260" width="176" height="32" rx="9" fill="url(#blue)"/><text x="136" y="281" text-anchor="middle" font-size="12" font-weight="700" fill="#FFF">Sign in</text><text x="136" y="340" text-anchor="middle" class="label">Secure access</text><text x="136" y="365" text-anchor="middle" class="small">Role-aware entry for</text><text x="136" y="385" text-anchor="middle" class="small">cashiers and managers</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">The Nabta POS journey</title>
  <desc id="desc">Five connected stages from secure login through selling, payment, management, and insights.</desc>
  <defs>

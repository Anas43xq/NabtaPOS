  <g transform="translate(316 744)"><rect width="968" height="92" rx="46" fill="#FFF" stroke="#DBEEFF"/><g transform="translate(36 23)"><circle cx="22" cy="22" r="22" fill="#EAF4FF"/><path d="M13 24l6 6 13-15" fill="none" stroke="#2589E0" stroke-width="3.5" stroke-linecap="round"/><text x="58" y="19" class="label">One shared business layer</text><text x="58" y="40" class="small">Consistent rules across desktop and API</text></g><g transform="translate(370 23)"><circle cx="22" cy="22" r="22" fill="#E5FAED"/><path d="M13 24l6 6 13-15" fill="none" stroke="#128274" stroke-width="3.5" stroke-linecap="round"/><text x="58" y="19" class="label">Clear daily operations</text><text x="58" y="40" class="small">From opening shift to reconciliation</text></g><g transform="translate(704 23)"><circle cx="22" cy="22" r="22" fill="#FFF3CD"/><path d="M13 24l6 6 13-15" fill="none" stroke="#D97706" stroke-width="3.5" stroke-linecap="round"/><text x="58" y="19" class="label">Built for growth</text><text x="58" y="40" class="small">Editable, scalable, and multilingual</text></g></g>

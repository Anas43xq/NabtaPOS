      <rect x="22" y="76" width="228" height="230" rx="16" fill="#F8FBFF" stroke="#DBEEFF"/><rect x="34" y="90" width="54" height="204" rx="8" fill="#0F2A4A"/><rect x="98" y="90" width="140" height="42" rx="8" fill="#FFF"/><rect x="98" y="142" width="66" height="64" rx="8" fill="#E5FAED"/><rect x="172" y="142" width="66" height="64" rx="8" fill="#EAF4FF"/><rect x="98" y="216" width="140" height="78" rx="8" fill="#FFF"/><path d="M110 274l25-18 24 7 26-29 38 18" fill="none" stroke="#2589E0" stroke-width="3"/><text x="136" y="340" text-anchor="middle" class="label">Run operations</text><text x="136" y="365" text-anchor="middle" class="small">Shifts, catalog, staff,</text><text x="136" y="385" text-anchor="middle" class="small">and purchase receipts</text>
    </g>
    <g transform="translate(1192)" filter="url(#shadow)"><rect width="272" height="410" rx="22" fill="#FFF"/><circle cx="34" cy="34" r="20" fill="url(#blue)"/><text x="34" y="41" text-anchor="middle" font-size="17" font-weight="800" fill="#FFF">5</text><text x="66" y="41" font-size="20" font-weight="750" class="navy">Understand</text>

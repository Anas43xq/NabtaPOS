    <symbol id="mark" viewBox="0 0 256 256"><path fill="#123D35" d="M62 92h132c12 0 22 10 22 22v104l-15 18-15-18-15 18-15-18-15 18-15-18-15 18-15-18-15 18-15-18-15 18-15-18-15 18-15-18V114c0-12 10-22 22-22Z"/><path fill="#72D6A1" d="M128 93c-2-28 5-52 21-70 13-14 30-23 52-27-1 24-9 43-24 57-13 12-29 19-49 22v18Z"/><path fill="#B7F2C8" d="M125 79c-22-4-39-13-51-27-11-13-16-29-16-49 22 3 40 11 52 26 12 14 17 31 15 50Z"/><rect fill="#F5FFF7" x="88" y="127" width="80" height="12" rx="6"/><rect fill="#72D6A1" x="88" y="154" width="54" height="12" rx="6"/><rect fill="#72D6A1" x="88" y="181" width="68" height="12" rx="6"/></symbol>
    <style>text{font-family:"Segoe UI",Arial,sans-serif}.navy{fill:#0F2A4A}.muted{fill:#526777}.small{font-size:13px;fill:#526777}.label{font-size:15px;font-weight:700;fill:#1A3A5C}</style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/><circle cx="1480" cy="30" r="320" fill="#CDE7FF"/><circle cx="120" cy="860" r="260" fill="#E5FAED"/>
  <g transform="translate(62 42)"><use href="#mark" width="70" height="70"/><text x="88" y="38" font-size="34" font-weight="760" class="navy">Nabta POS</text><text x="90" y="62" font-size="12" fill="#128274" letter-spacing="1.6">THE COMPLETE WORKFLOW</text></g>
  <text x="1520" y="77" text-anchor="end" font-size="18" class="muted">Built for the rhythm of real service</text>
  <text x="800" y="165" text-anchor="middle" font-size="54" font-weight="780" class="navy">From login to insight.</text><text x="800" y="205" text-anchor="middle" font-size="20" class="muted">One connected workflow for faster service and clearer operations.</text>


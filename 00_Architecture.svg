<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Nabta POS architecture</title>
  <desc id="desc">The WPF desktop and ASP.NET Core API use shared business and data layers, while the external mobile app connects through the API.</desc>
  <defs>

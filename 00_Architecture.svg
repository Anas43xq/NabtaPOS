    <path d="M730 204C786 204 798 116 860 116" fill="none" stroke="#5B8AB0" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M1010 194V248" fill="none" stroke="#5B8AB0" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M1160 326C1215 326 1230 231 1290 231" fill="none" stroke="#5B8AB0" stroke-width="3" marker-end="url(#arrow)"/>
  </g>
  <g transform="translate(505 650)"><rect width="590" height="62" rx="31" fill="#FFF" stroke="#DBEEFF"/><text x="295" y="25" text-anchor="middle" class="tag">CONTRACTS</text><text x="295" y="47" text-anchor="middle" class="sub">Shared request, response, DTO, and printing models</text></g>

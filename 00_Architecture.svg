    <g transform="translate(860 248)" filter="url(#shadow)"><rect width="300" height="156" rx="20" fill="#FFF"/><rect width="10" height="156" rx="5" fill="#0E9AAA"/><circle cx="61" cy="61" r="28" fill="#E7FAFC"/><path d="M47 48h28v25H47zM53 43h16" fill="none" stroke="#0E9AAA" stroke-width="3"/><text x="110" y="55" font-size="12" font-weight="700" letter-spacing="1.2" fill="#0E9AAA">PERSISTENCE</text><text x="110" y="86" class="title">DAL Repositories</text><text x="34" y="124" class="sub">EF Core · targeted ADO.NET</text></g>

    <g transform="translate(1290 143)" filter="url(#shadow)"><rect width="248" height="176" rx="20" fill="url(#navy)"/><ellipse cx="124" cy="52" rx="54" ry="22" fill="#2589E0"/><path d="M70 52v56c0 12 24 22 54 22s54-10 54-22V52" fill="#1A3F6B" stroke="#72D6A1" stroke-width="2"/><path d="M70 80c0 12 24 22 54 22s54-10 54-22" fill="none" stroke="#72D6A1" stroke-width="2"/><text x="124" y="151" text-anchor="middle" font-size="22" font-weight="750" fill="#FFF">SQL Server</text></g>


    <style>text{font-family:"Segoe UI",Arial,sans-serif}.title{font-size:23px;font-weight:750;fill:#0F2A4A}.sub{font-size:15px;fill:#526777}.tag{font-size:12px;font-weight:700;letter-spacing:1.2px;fill:#2589E0}</style>
  </defs>
  <rect width="1600" height="760" rx="28" fill="url(#bg)"/><circle cx="1510" cy="20" r="260" fill="#D5EAFF"/><path d="M0 620C180 560 340 610 470 760H0Z" fill="#E5FAED"/>
  <g transform="translate(58 42)"><use href="#mark" width="62" height="62"/><text x="80" y="34" font-size="31" font-weight="760" fill="#0F2A4A">Nabta POS</text><text x="82" y="57" class="tag">SYSTEM ARCHITECTURE</text></g>
  <text x="1540" y="72" text-anchor="end" font-size="17" fill="#526777">Shared rules. Clear boundaries.</text>

  <g transform="translate(62 168)">
    <g filter="url(#shadow)"><rect width="300" height="156" rx="20" fill="#FFF"/><rect width="10" height="156" rx="5" fill="#2589E0"/><rect x="34" y="34" width="54" height="54" rx="14" fill="#EAF4FF"/><path d="M48 50h27v19H48zM53 75h17" fill="none" stroke="#2589E0" stroke-width="3" stroke-linecap="round"/><text x="110" y="55" class="tag">WINDOWS CLIENT</text><text x="110" y="86" class="title">WPF Desktop</text><text x="34" y="124" class="sub">Cashier and manager UI</text></g>
